[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-pdf-regression-kit"
version = "0.1.0"
description = "Early-stage independent Arabic PDF extraction regression fixtures and diagnostics"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
fixtures = ["fpdf2==2.8.9", "uharfbuzz==0.57.0"]
pypdf = ["pypdf==6.21.2"]
docling = ["docling>=2,<3"]
dev = ["pytest>=8", "ruff", "mypy", "build"]

[project.scripts]
arabic-pdf-kit = "arabic_pdf_regression.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arabic_pdf_regression = ["data/**/*", "py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

