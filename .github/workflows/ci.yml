name: offline-core
on: [push, pull_request, workflow_dispatch]
jobs:
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,pypdf]"
      - run: python -m pytest -q
      - run: python -m ruff check src tests tools examples
      - run: python -m mypy src
      - run: python -m build
      - run: python -m venv .venv-clean
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .venv-clean/Scripts/python -m pip install dist/arabic_pdf_regression_kit-0.1.0-py3-none-any.whl pypdf==6.21.2
          python tools/verify_installed.py --python .venv-clean/Scripts/python.exe
      - if: runner.os != 'Windows'
        run: |
          .venv-clean/bin/python -m pip install dist/arabic_pdf_regression_kit-0.1.0-py3-none-any.whl pypdf==6.21.2
          python tools/verify_installed.py --python .venv-clean/bin/python

